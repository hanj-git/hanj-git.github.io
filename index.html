<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visual Archives</title>
    <style>
        /* 徹底移除外框邊距，防止畫面縮在中間 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; 
            overflow: hidden; 
            background-color: #000814; /* 你的深藍底色 */
        }
        .container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
        }
        iframe {
            width: 100%; height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <iframe 
            src="https://embed.figma.com/proto/0SaJcPhVKXJwkxPxJzaYOq/%E5%8D%B1%E9%9A%AA%E8%A3%BD%E9%80%A0%E8%A6%96%E8%A6%BA%E6%AA%94%E6%A1%88?node-id=0-1&scaling=scale-down-width&content-scaling=fixed&page-id=0%3A1&starting-point-node-id=0%3A1&hide-ui=1" 
            allowfullscreen>
        </iframe>
    </div>
</body>
</html>
