<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Design Portfolio</title>
    <style>
        /* 徹底清除瀏覽器預設的白邊 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #000814; /* 你的深藍色底，確保載入時不閃白光 */
        }

        /* 強制讓 iframe 填滿整個螢幕寬高 */
        .container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <iframe 
            src="https://embed.figma.com/site/0SaJcPhVKXJwkxPxJzaYOq/%E5%8D%B1%E9%9A%AA%E8%A3%BD%E9%80%A0%E8%A6%96%E8%A6%BA%E6%AA%94%E6%A1%88?node-id=0-4&embed-host=share&hide-ui=1" 
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
