<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>危機製造視覺檔案 - 焦子</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background: #0a0a0a;
            color: #eee;
            overflow-x: hidden;
        }
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(15,15,15,0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a {
            color: #eee;
            text-decoration: none;
            margin-left: 30px;
            cursor: pointer;
            transition: color 0.3s;
        }
        nav a:hover { color: #00bfff; }

        .section {
            min-height: 100vh;
            padding: 120px 40px 80px;
            display: none;
        }
        .section.active { display: block; }

        .hero {
            text-align: center;
            padding: 150px 20px;
        }
        h1 { font-size: 3.5rem; margin-bottom: 20px; }
        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 32px;
            background: #00bfff;
            color: #000;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: scale(1.05);
            background: #fff;
        }
    </style>
</head>
<body>

    <header>
        <h2>危機製造視覺檔案</h2>
        <nav>
            <a onclick="showSection('home')">首頁</a>
            <a onclick="showSection('project')">作品</a>
            <a onclick="showSection('about')">關於</a>
        </nav>
    </header>

    <!-- 首頁 -->
    <div id="home" class="section active">
        <div class="hero">
            <h1>危機製造視覺檔案</h1>
            <p style="font-size:1.4rem; opacity:0.9;">焦子 · Visual Design Project</p>
            <a href="#" class="btn" onclick="showSection('project')">進入作品</a>
        </div>
    </div>

    <!-- 作品頁 -->
    <div id="project" class="section">
        <h2 style="text-align:center; margin-bottom:40px;">作品展示</h2>
        <p style="text-align:center; font-size:1.2rem;">這裡可以放你的 Figma 截圖或描述<br>之後可以加入點擊放大、切換不同裝置畫面等互動</p>
        <!-- 你可以之後在這裡加入更多互動內容 -->
    </div>

    <!-- 關於頁 -->
    <div id="about" class="section">
        <h2 style="text-align:center;">關於這個專案</h2>
        <p style="max-width:700px; margin:40px auto; text-align:center; font-size:1.1rem;">
            在這裡寫你的設計概念、過程、想傳達的訊息...
        </p>
    </div>

    <script>
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(sec => {
                sec.classList.remove('active');
            });
            document.getElementById(sectionId).classList.add('active');
        }
    </script>
</body>
</html>
