<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        /* 1. 把背景換成你原本要的深藍色 */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%;
            overflow: hidden; 
            background-color: #000814; /* 這是之前的深藍色，你可以換成你最愛的色號 */
        }

        /* 2. 讓視窗完全滿版，不留任何白邊或縫隙 */
        iframe { 
            width: 100vw; 
            height: 100vh; 
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <iframe src="https://embed.figma.com/site/0SaJcPhVKXJwkxPxJzaYOq/%E5%8D%B1%E9%9A%AA%E8%A3%BD%E9%80%A0%E8%A6%96%E8%A6%BA%E6%AA%94%E6%A1%88?node-id=0-1&embed-host=share&hide-ui=1" allowfullscreen></iframe>
</body>
</html>
