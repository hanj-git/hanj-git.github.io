<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visual Archives</title>
    <style>
        /* 徹底拔除瀏覽器預設的白邊與捲軸 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #000814; /* 你的品牌深藍底，確保載入時不閃白光 */
        }

        /* 打造一個跟瀏覽器視窗一模一樣大的隱形外殼 */
        .fullscreen-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        /* 讓 Figma 滿版，並消滅邊框 */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="fullscreen-wrapper">
        <iframe 
            src="https://embed.figma.com/proto/0SaJcPhVKXJwkxPxJzaYOq/%E5%8D%B1%E9%9A%AA%E8%A3%BD%E9%80%A0%E8%A6%96%E8%A6%BA%E6%AA%94%E6%A1%88?node-id=0-1&scaling=scale-down-width&content-scaling=fixed&page-id=0%3A1&starting-point-node-id=0%3A1&hide-ui=1" 
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
